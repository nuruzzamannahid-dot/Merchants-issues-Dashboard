<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Migrate Merchant Grouping → Turso</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #0f1115; color: #e6e6e6; }
  button { background: #ffcc00; color: #111; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #log { white-space: pre-wrap; background: #1a1d24; border-radius: 8px; padding: 14px; margin-top: 16px; font-family: monospace; font-size: 13px; max-height: 60vh; overflow: auto; }
  label { display: block; margin: 10px 0; }
  .warn { color: #ffb020; }
</style>
</head>
<body>
  <h2>Merchant Grouping: Google Sheet → Turso</h2>
  <p>One-time migration. Reads the published CSV, writes it into the <code>merchant_grouping</code> table on
     <code>ad-merchant-grouping</code>. Safe to re-run — it clears the table first, so it won't create duplicates.</p>
  <label><input type="checkbox" id="clearFirst" checked> Clear existing rows in Turso before importing</label>
  <button id="runBtn" onclick="runMigration()">Run migration</button>
  <div id="log"></div>

<script>
const ADM_GROUP_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTuapDC5l3Klr5XdcIf8ptsTMAkAkM38Zc6PdqlQj1-AzSCYgkSHU_pTcD6z35kq9B5hfzx5dnjbYrD/pub?output=csv';
const GROUP_TURSO_URL = 'https://ad-merchant-grouping-nuruzzamannahid-dot.aws-ap-south-1.turso.io/v2/pipeline';
const GROUP_TURSO_TOKEN = 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODg2OTMxMzQsImlkIjoiMDFhMDc2NTktOWEwMS03NWJlLTg4YWEtNDEwZjI2YjhjNjI1Iiwia2lkIjoianJpQ3JvbGdhcHJHMDlHOXFsOWtNZDFlX2hiN1ZnUV9vYzJGNXlPdGVYWSIsInJpZCI6ImU2YjdjODRjLWQ1ZWMtNDE3ZS1hMTJhLThkMzhlNzMzMDg1MSJ9.pEcKWqkYd-GMpYPBfiQUwBg6L_hNJzKK8TrDU2SyrPvjgj2NtNgWEMmm2LTd_zMXGqc8zlOleF61pl491HUzCA';

const logEl = document.getElementById('log');
function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
}

// Same CSV parser used in index.html (handles quoted fields with commas/newlines).
function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (inQuotes) {
            if (c === '"' && next === '"') { field += '"'; i++; }
            else if (c === '"') { inQuotes = false; }
            else { field += c; }
        } else if (c === '"') {
            inQuotes = true;
        } else if (c === ',') {
            row.push(field); field = '';
        } else if (c === '\n' || c === '\r') {
            if (c === '\r' && next === '\n') i++;
            row.push(field); field = '';
            if (row.length > 1 || row[0] !== '') rows.push(row);
            row = [];
        } else {
            field += c;
        }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
}

function tursoArgs(args) {
    return args.map(a => {
        if (a === null || a === undefined) return { type: 'null', value: null };
        if (typeof a === 'number') return { type: Number.isInteger(a) ? 'integer' : 'float', value: String(a) };
        return { type: 'text', value: String(a) };
    });
}

async function tursoBatch(stmts) {
    const requests = stmts.map(s => ({
        type: 'execute',
        stmt: (s.args && s.args.length) ? { sql: s.sql, args: tursoArgs(s.args) } : { sql: s.sql }
    }));
    requests.push({ type: 'close' });
    const res = await fetch(GROUP_TURSO_URL, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${GROUP_TURSO_TOKEN}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests })
    });
    if (!res.ok) throw new Error(`Turso HTTP ${res.status}`);
    const data = await res.json();
    const errored = (data.results || []).find(r => r && r.type === 'error');
    if (errored) throw new Error(errored.error?.message || 'Turso batch failed');
    return data;
}

async function runMigration() {
    const btn = document.getElementById('runBtn');
    btn.disabled = true;
    logEl.innerHTML = '';
    try {
        log('Fetching published CSV from Google Sheets…');
        const resp = await fetch(ADM_GROUP_CSV_URL);
        if (!resp.ok) throw new Error(`CSV fetch responded ${resp.status}`);
        const text = await resp.text();
        const allRows = parseCSV(text);
        const header = allRows[0] || [];
        const dataRows = allRows.slice(1).filter(r => r.some(cell => String(cell).trim() !== ''));
        log(`Header columns: ${header.join(' | ')}`);
        log(`Found ${dataRows.length} data rows.`);

        log('Ensuring merchant_grouping table exists on Turso…');
        await tursoBatch([{
            sql: `CREATE TABLE IF NOT EXISTS merchant_grouping (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                business_name TEXT,
                group_name TEXT,
                phone TEXT,
                reg_phone TEXT,
                updated_at TEXT
            )`
        }]);

        if (document.getElementById('clearFirst').checked) {
            log('Clearing existing rows…');
            await tursoBatch([{ sql: 'DELETE FROM merchant_grouping' }]);
        }

        // Columns follow the same layout enrichWithGroupData() used to read
        // from the CSV: B=business name (r[1]), D=group (r[3]), E=phone (r[4]),
        // F=reg phone (r[5]). Adjust the indices below if your sheet's column
        // order differs.
        const nowISO = new Date().toISOString();
        const CHUNK = 50;
        let inserted = 0;
        for (let i = 0; i < dataRows.length; i += CHUNK) {
            const chunk = dataRows.slice(i, i + CHUNK);
            const stmts = chunk.map(r => ({
                sql: `INSERT INTO merchant_grouping (business_name, group_name, phone, reg_phone, updated_at) VALUES (?, ?, ?, ?, ?)`,
                args: [r[1] || '', r[3] || '', r[4] || '', r[5] || '', nowISO]
            }));
            await tursoBatch(stmts);
            inserted += chunk.length;
            log(`Inserted ${inserted} / ${dataRows.length}…`);
        }

        log(`Done. ${inserted} rows migrated into Turso.`, 'warn');
        log('You can now delete this file — the dashboard reads from Turso going forward.');
    } catch (e) {
        log('ERROR: ' + e.message, 'warn');
        console.error(e);
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
